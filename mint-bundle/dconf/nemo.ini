[compact-view]
all-columns-have-same-width=false

[desktop]
computer-icon-visible=false
desktop-layout='true::false'
home-icon-visible=false
network-icon-visible=false
show-orphaned-desktop-icons=true
trash-icon-visible=false
volumes-visible=false

[icon-view]
default-zoom-level='standard'
labels-beside-icons=false

[plugins]
disabled-actions=['90_new-launcher.nemo_action', 'add-desklets.nemo_action', 'mintstick-verify.nemo_action']

[preferences]
close-device-view-on-device-eject=true
default-folder-viewer='list-view'
quick-renames-with-pause-in-between=true
show-full-path-titles=false
show-hidden-files=false

[search]
search-reverse-sort=false
search-sort-column='name'

[window-state]
geometry='1247x724+818+212'
maximized=true
sidebar-bookmark-breakpoint=5
start-with-sidebar=true
