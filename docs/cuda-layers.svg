<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="430" fill="#f7f9fc"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">What CUDA is: the layers on your PC</text>

  <!-- Top: apps -->
  <rect x="150" y="60" width="600" height="60" rx="10" fill="#e8f0fe" stroke="#4a78c2" stroke-width="2"/>
  <text x="450" y="86" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Your apps</text>
  <text x="450" y="106" text-anchor="middle" font-size="12" fill="#333">Games, desktop, LM Studio, video tools, AI apps that use the GPU</text>

  <!-- CUDA toolkit: optional -->
  <rect x="150" y="140" width="600" height="70" rx="10" fill="#ffffff" stroke="#999" stroke-width="2" stroke-dasharray="8,5"/>
  <text x="450" y="166" text-anchor="middle" font-size="15" font-weight="bold" fill="#777">CUDA toolkit  (developer tools: nvcc, profilers)</text>
  <text x="450" y="188" text-anchor="middle" font-size="12" fill="#777">OPTIONAL. Only needed to compile your own CUDA code. addons/cuda.sh installs or removes it.</text>

  <!-- Driver: keep -->
  <rect x="150" y="230" width="600" height="60" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="2"/>
  <text x="450" y="256" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">NVIDIA driver 595  (includes the CUDA runtime libraries)</text>
  <text x="450" y="276" text-anchor="middle" font-size="12" fill="#333">REQUIRED. Used by games and apps. Never removed by these scripts.</text>

  <!-- Hardware -->
  <rect x="150" y="310" width="600" height="50" rx="10" fill="#fff4e5" stroke="#e08a00" stroke-width="2"/>
  <text x="450" y="340" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">RTX 3060 graphics card</text>

  <!-- Arrows up -->
  <line x1="450" y1="360" x2="450" y2="292" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <!-- Legend -->
  <rect x="150" y="385" width="18" height="18" fill="#e6f4ea" stroke="#2e7d32"/>
  <text x="176" y="399" font-size="12" fill="#333">keep</text>
  <rect x="240" y="385" width="18" height="18" fill="#ffffff" stroke="#999" stroke-dasharray="4,3"/>
  <text x="266" y="399" font-size="12" fill="#333">optional (you can remove it)</text>
</svg>
